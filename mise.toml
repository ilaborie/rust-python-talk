[env]
TOBOGGAN_HOST = "0.0.0.0"

[tasks.build]
description = "Génère index.html (ce que la CI publie sur GitHub Pages)"
run = "toboggan build -o index.html"

[tasks.pdf]
description = "Compile talk.pdf (préambule : slides/_preamble.typ)"
run = "toboggan pdf -o talk.pdf"

[tasks.dev]
description = "Sert le deck et recharge à chaque modification"
run = "RUST_LOG=info toboggan watch"

[tasks.run]
description = "Sert le deck sans watch"
run = "RUST_LOG=warn toboggan watch --no-watch"
