[package]
name = "rusty_otel"
version = "0.1.0"
edition = "2024"

[lib]
name = "rusty_otel"
crate-type = ["cdylib"]

[dependencies]
comrak = { version = "0.54", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py38"] }

pyo3-log = "0.13"

tracing = { version = "0.1", features = ["log-always"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-stdout = "0.32"
