default_job = "toboggan"

[jobs.toboggan]
command = ["toboggan-cli", "--output", "rust-python.toml", "./slides/"]
need_stdout = true
allow_warnings = true
default_watch = false
watch = ["slides"]

[jobs.html]
command = ["toboggan-cli", "--output", "index.html", "./slides/"]
need_stdout = true
allow_warnings = true
default_watch = false
watch = ["slides"]
