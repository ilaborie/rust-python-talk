<style>
/* ------------------------------------------------------------------------
   1. Indépendance vis-à-vis de la résolution
   ------------------------------------------------------------------------
   Le thème Toboggan fixe `html { font-size: 32px }` alors que la scène
   (`section`) est en unités viewport (80vw × 100%). Résultat : le deck ne
   tient que sur un écran ≥ 1920×1080 et déborde partout ailleurs.

   On rend la base typographique proportionnelle au viewport, en prenant la
   contrainte la plus serrée des deux axes. Les coefficients donnent 40px en
   1920×1080, donc : ce qui tient en Full HD tient partout.

     1080 × 0.037 = 40px        1920 × 0.02083 = 40px

   40px, et pas plus : au-delà de 46px la slide « Le résultat » déborde. Mesuré
   sur l'export statique, JS coupé (toutes les étapes révélées, chaque slide à
   100vh), de 1280×800 à 3840×2160.

   Le clamp n'est qu'un garde-fou : 80px correspond exactement au 4K natif.
   ------------------------------------------------------------------------ */
html {
	font-size: clamp(10px, min(3.7vh, 2.083vw), 80px);
}

/* ------------------------------------------------------------------------
   2. Échelle typographique du deck
   ------------------------------------------------------------------------
   Le contenu des slides vit dans un shadow tree : les sélecteurs descendants
   ne le traversent pas, mais les custom properties si. Le thème expose
   `--slide-*-size` exactement pour ça.

   Ce deck est dense en code : on rend un peu de place au corps en réduisant
   les titres, et on cale les blocs de code sur une taille qui laisse passer
   ~72 colonnes dans la largeur de scène.
   ------------------------------------------------------------------------ */
.toboggan-slide {
	--slide-h1-size: 230%;
	--slide-h2-size: 170%;
	--slide-code-size: 64%;
	--slide-table-size: 90%;
}
</style>
